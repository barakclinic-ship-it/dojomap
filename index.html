<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#fbf8ef">
<title>dojomaps</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="dojomaps">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&family=Secular+One&display=swap" rel="stylesheet">
<style>
/* Layout: sticky header (location, radius, filters), then a plain list of dojos sorted by distance with call / WhatsApp / Waze on every row. */
:root{
  --bg:#fbf8ef;
  --panel:#ffffff;
  --line:#e2e6d2;
  --green:#4e7d1e;
  --green-hi:#8fb23f;
  --green-soft:#e7f0d3;
  --text:#0b2140;
  --muted:#5d6d86;
  --font-body:Rubik, "Segoe UI", Arial, sans-serif;
  --font-display:"Secular One", Rubik, "Segoe UI", Arial, sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-body)}
button,input{font-family:inherit;color:inherit}
a{color:inherit}
svg.i{width:18px;height:18px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}

header{position:sticky;top:0;z-index:10;background:var(--bg);padding:12px 16px 10px;padding-top:calc(12px + env(safe-area-inset-top));border-bottom:2px solid var(--green-hi)}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.brand img{height:44px;width:auto}
.word{flex:1;font-family:var(--font-display);font-size:24px;line-height:1;direction:ltr;text-align:right}
.word .a{color:var(--text)} .word .b{color:var(--green)}
.install{display:inline-flex;align-items:center;gap:6px;background:var(--green-soft);border:1px solid var(--green-hi);color:var(--green);border-radius:999px;padding:6px 11px;font-size:13px;font-weight:700;cursor:pointer}
.install[hidden]{display:none}
.row{display:flex;gap:8px;align-items:center}
.field{flex:1;position:relative;min-width:0}
.field svg{position:absolute;right:11px;top:50%;transform:translateY(-50%);color:var(--muted)}
.field input{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px 36px 11px 12px;font-size:15px;outline:none}
.field input:focus{border-color:var(--green)}
.field input::placeholder{color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:6px;border-radius:12px;padding:11px 12px;font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap;border:0;background:var(--green);color:#fff}
.sugg{position:absolute;top:100%;right:0;left:0;background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-top:4px;overflow:hidden;display:none;box-shadow:0 10px 30px #0b214022;z-index:20}
.sugg div{padding:10px 12px;font-size:14px;border-bottom:1px solid var(--line);cursor:pointer}
.sugg div:last-child{border:none}
.chips{display:flex;gap:6px;overflow-x:auto;margin-top:8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips:empty{display:none}
.chip{flex:0 0 auto;padding:6px 11px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-size:13px;color:var(--muted);cursor:pointer;font-variant-numeric:tabular-nums}
.chip.on{background:var(--green);border-color:var(--green);color:#fff;font-weight:700}
.chip.soft.on{background:var(--green-soft);border-color:var(--green-hi);color:var(--green)}
.lbl{flex:0 0 auto;font-size:12px;color:var(--muted);align-self:center;margin-left:2px}

main{padding:12px 16px calc(24px + env(safe-area-inset-bottom))}
.summary{font-size:13px;color:var(--muted);margin:2px 2px 10px}
.summary b{color:var(--text)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px}
.top{display:flex;gap:10px;align-items:flex-start}
.name{flex:1;min-width:0;font-weight:700;font-size:16px;line-height:1.3}
.dist{text-align:left;font-size:13px;color:var(--green);font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.dist small{display:block;font-weight:400;color:var(--muted);font-size:11px}
.arts{font-size:12px;color:var(--muted);margin-top:3px}
.line{display:flex;gap:8px;align-items:flex-start;font-size:14px;margin-top:8px;line-height:1.45}
.line svg{color:var(--green);margin-top:2px}
.line .v{flex:1;min-width:0;word-break:break-word}
.line .v.none{color:var(--muted)}
.acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.act{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 12px;border-radius:12px;font-size:14px;font-weight:700;text-decoration:none;border:1px solid var(--line);background:var(--panel)}
.act.call{flex:1;min-width:150px;background:var(--green);border-color:var(--green);color:#fff;direction:ltr;font-variant-numeric:tabular-nums}
.act.find{flex:1;min-width:150px;background:var(--green-soft);border-color:var(--green-hi);color:var(--green)}
.empty{text-align:center;color:var(--muted);padding:40px 16px;line-height:1.6}
.empty img{height:110px;display:block;margin:0 auto 12px}
.empty h2{font-family:var(--font-display);font-weight:400;color:var(--green);font-size:20px;margin:0 0 6px}
.spinner{width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--green);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 10px}
@keyframes spin{to{transform:rotate(360deg)}}
.showmore{display:block;width:100%;padding:12px;border-radius:12px;border:1px dashed var(--green-hi);background:transparent;color:var(--green);font-weight:700;font-size:14px;cursor:pointer;margin-top:4px}
.note{font-size:11px;color:var(--muted);text-align:center;margin-top:16px;line-height:1.6}
</style>
</head>
<body>
<header>
  <div class="brand">
    <img data-logo alt="dojomaps">
    <div class="word"><span class="a">dojo</span><span class="b">maps</span></div>
    <button class="install" id="installBtn" hidden>התקנה</button>
  </div>
  <div class="row">
    <div class="field">
      <svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" placeholder="עיר או כתובת" autocomplete="off" aria-label="עיר או כתובת">
      <div class="sugg" id="sugg"></div>
    </div>
    <button class="btn" id="meBtn"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2.5"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>סביבי</button>
  </div>
  <div class="chips" id="radii"></div>
  <div class="chips" id="filters"></div>
  <div class="chips" id="arts"></div>
</header>

<main id="main">
  <div class="empty">
    <img data-logo alt="">
    <h2>מכוני אמנויות לחימה סביבך</h2>
    לחצו "סביבי" או כתבו עיר, ותקבלו רשימה לפי מרחק:<br>טלפון, כתובת ושעות. לחיצה על הטלפון מחייגת.
  </div>
</main>

/* ---------- install as app ---------- */
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
let deferredPrompt = null;
addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredPrompt = e; $('installBtn').hidden = false; });
addEventListener('appinstalled', () => { $('installBtn').hidden = true; });
if (isIOS && !standalone) $('installBtn').hidden = false;
$('installBtn').onclick = async () => {
  if (deferredPrompt){ deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt = null; $('installBtn').hidden = true; return; }
  if (isIOS) alert('בספארי: כפתור השיתוף ואז "הוספה למסך הבית"');
};

const ARTS = [
  ['karate','קראטה',/karate|קרטה|קראטה|shotokan|שוטוקאן|kyokushin|קיוקושין|goju|wado|shito/i],
  ['judo','ג׳ודו',/judo|ג'ודו|ג׳ודו|גודו/i],
  ['bjj','ג׳יו ג׳יטסו',/jiu.?jitsu|ju.?jitsu|jujutsu|bjj|ג'יו|ג׳יו|ג'וג'יטסו|גרייסי|gracie/i],
  ['krav','קרב מגע',/krav|קרב מגע|kapap|self.?defen[cs]e|הגנה עצמית/i],

  ['kick','קיקבוקס ותאי',/kick.?box|muay|thai|savate|lethwei|קיקבוקס|קיק בוקס|מואי/i],
  ['mma','MMA',/(^|[^a-z])mma([^a-z]|$)|mixed.martial/i],
  ['aikido','אייקידו',/aikido|אייקידו|איקידו/i],
  ['kungfu','קונג פו',/kung.?fu|wushu|wing.?chun|ving.?tsun|tai.?chi|kung_fu|sanda|bagua|xingyi|קונג פו|וינג צ|טאי צ/i],
  ['capoeira','קפוארה',/capoeira|קפוארה|קפואירה/i],

  ['wrestle','היאבקות',/wrestl|sambo|grappling|היאבקות|סמבו/i],
  ['sword','קנדו וסייף',/kendo|iaido|kenjutsu|fencing|hema|קנדו|סייף/i],
  ['other','אמנויות לחימה',/./]
];
const ARTNAME = Object.fromEntries(ARTS.map(a=>[a[0],a[1]]));
function classify(t){
  const hay = [t.sport,t.name,t['name:he'],t['name:en'],t.description].filter(Boolean).join(' ; ');
  const f = ARTS.filter(a=>a[0]!=='other' && a[2].test(hay)).map(a=>a[0]);
  return f.length ? f : ['other'];
}
const KIDS_RE = /ילדים|לילדים|לנוער|נוער|צהרון|גן ילדים|פעוטות|\bkids?\b|children|junior|youth|toddler|kindergarten|preschool/i;
const isKids = t => ['school','kindergarten','childcare'].includes(t.amenity) || KIDS_RE.test([t.name,t['name:he'],t.description].filter(Boolean).join(' '));

/* ---------- state ---------- */
let center = null, radiusKm = 5, all = [], art = 'all', onlyPhone = true, showKids = false;
try { const s = JSON.parse(localStorage.getItem('dojomaps') || '{}'); if (s.r) radiusKm = s.r; if (s.onlyPhone === false) onlyPhone = false; } catch(e){}
function save(){ try{ localStorage.setItem('dojomaps', JSON.stringify({r:radiusKm, onlyPhone})); }catch(e){} }

/* ---------- header chips ---------- */
function chip(box, label, on, fn, soft){ const c=document.createElement('button'); c.className='chip'+(on?' on':'')+(soft?' soft':''); c.textContent=label; c.onclick=fn; box.appendChild(c); }
function buildRadii(){
  const b=$('radii'); b.innerHTML='<span class="lbl">רדיוס</span>';
  [2,5,10,20,40].forEach(r=>chip(b, r+' ק״מ', r===radiusKm, ()=>{ radiusKm=r; save(); buildRadii(); if (center) load(); }));
}
buildRadii();
function buildFilters(){
  const b=$('filters'); b.innerHTML='';
  if (!all.length) return;
  const withPhone = all.filter(p=>p.phone).length;
  chip(b, 'רק עם טלפון · '+withPhone, onlyPhone, ()=>{ onlyPhone=!onlyPhone; save(); render(); }, true);
  const kids = all.filter(p=>p.kids).length;
  if (kids) chip(b, (showKids?'כולל':'בלי')+' חוגי ילדים · '+kids, !showKids, ()=>{ showKids=!showKids; render(); }, true);
  const a=$('arts'); a.innerHTML='';
  const counts={}; visibleBase().forEach(p=>p.arts.forEach(x=>counts[x]=(counts[x]||0)+1));
  if (art!=='all' && !counts[art]) art='all';
  chip(a, 'הכל', art==='all', ()=>{ art='all'; render(); });
  ARTS.filter(x=>counts[x[0]]).forEach(x=>chip(a, x[1]+' · '+counts[x[0]], art===x[0], ()=>{ art=x[0]; render(); }));
}

/* ---------- distance & travel time ---------- */
function hav(a,b,c,d){const R=6371,r=x=>x*Math.PI/180;const dl=r(c-a),dn=r(d-b);const h=Math.sin(dl/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h));}
const fmtKm = km => km<1 ? Math.round(km*1000)+' מ׳' : km.toFixed(1)+' ק״מ';
function fmtMin(m){ m=Math.max(1,Math.round(m)); return m<60 ? m+' דק׳' : Math.floor(m/60)+':'+String(m%60).padStart(2,'0')+' ש׳'; }
/* rough: streets are ~30-40% longer than a straight line; walking 4.8 km/h, city driving ~28 km/h */
function travel(km){ const road=km*1.35; return km<1.5 ? 'כ־'+fmtMin(road/4.8*60)+' ברגל' : 'כ־'+fmtMin(road/28*60+3)+' ברכב'; }

/* ---------- opening hours, in Hebrew ---------- */
const DAYS={Su:'א׳',Mo:'ב׳',Tu:'ג׳',We:'ד׳',Th:'ה׳',Fr:'ו׳',Sa:'שבת',PH:'חג'};
function hoursText(oh){
  if (!oh) return '';
  if (oh.trim()==='24/7') return 'פתוח 24/7';
  return oh.split(';').map(s=>s.trim()).filter(Boolean).map(seg=>seg
    .replace(/\b(Su|Mo|Tu|We|Th|Fr|Sa|PH)\b/g,d=>DAYS[d]).replace(/\boff\b|\bclosed\b/gi,'סגור')).join(' · ');
}

/* ---------- phone helpers ---------- */
const firstPhone = t => (t.phone || t['contact:phone'] || t['contact:mobile'] || '').split(';')[0].trim();
const telHref = p => 'tel:' + p.replace(/[^\d+]/g,'');
function waNum(n){ let d=n.replace(/[^\d+]/g,''); if (d.startsWith('+')) return d.slice(1); if (d.startsWith('00')) return d.slice(2); if (d.startsWith('0') && cc==='il') return '972'+d.slice(1); return d; }

/* ---------- fetch dojos (OpenStreetMap, free) ---------- */
const SPORTS='karate|judo|taekwondo|boxing|kickboxing|martial_arts|jiu-jitsu|brazilian_jiu-jitsu|ju-jitsu|aikido|kung_fu|wushu|krav_maga|mma|muay_thai|kendo|iaido|capoeira|wrestling|sambo|tai_chi|wing_chun|hapkido|silat|eskrima|arnis|kali|systema|jeet_kune_do|ninjutsu|kenpo|savate|sanda|sumo|kyudo|grappling|hema|fencing|kalaripayattu|bokator|lethwei|kudo';
const NAME_RE="karate|judo|dojo|dojang|jiu.?jitsu|bjj|krav|taekwon|kickbox|muay|aikido|kung.?fu|wing.?chun|capoeira|kendo|boxing|silat|eskrima|systema|ninjutsu|kenpo|hapkido|sambo|grappling|martial|קרטה|קראטה|ג'ודו|ג׳ודו|דוג'ו|דוג׳ו|קרב מגע|טאקוונדו|קיקבוקס|אגרוף|אייקידו|קונג פו|אמנויות לחימה|אומנויות לחימה|ג'יו|ג׳יו|קפוארה|הגנה עצמית|מואי תאי|סמבו|וינג|לחימה";
const ENDPOINTS=['https://overpass-api.de/api/interpreter','https://overpass.kumi.systems/api/interpreter','https://overpass.private.coffee/api/interpreter'];
const NOT_DOJO=['restaurant','cafe','fast_food','bar','pub','pharmacy','fuel','bank'];
let cc = null, loadSeq = 0;

function status(html){ $('main').innerHTML = '<div class="empty">'+html+'</div>'; }
async function load(){
  const seq = ++loadSeq;
  status('<div class="spinner"></div>מחפש מכונים ברדיוס '+radiusKm+' ק״מ');
  const A=`(around:${radiusKm*1000},${center.lat},${center.lon})`;
  const q=`[out:json][timeout:25];(
    nwr["sport"~"${SPORTS}",i]${A};
    nwr["amenity"="dojo"]${A};
    nwr["leisure"~"sports_centre|fitness_centre|sports_hall"]["name"~"${NAME_RE}",i]${A};
    nwr["club"="sport"]["name"~"${NAME_RE}",i]${A};
    nwr["name"~"dojo|דוג'ו|דוג׳ו|קרב מגע|אמנויות לחימה|אומנויות לחימה|karate|קרטה|קראטה|judo|ג'ודו|ג׳ודו|martial arts",i]${A};
  );out center tags;`;
  let data=null;
  for (const ep of ENDPOINTS){
    try{
      const ctl=new AbortController(); const tm=setTimeout(()=>ctl.abort(),20000);
      const r=await fetch(ep,{method:'POST',body:'data='+encodeURIComponent(q),headers:{'Content-Type':'application/x-www-form-urlencoded'},signal:ctl.signal});
      clearTimeout(tm);
      if (r.ok){ data=await r.json(); break; }
    }catch(e){}
  }
  if (seq!==loadSeq) return;
  if (!data){ status('שרת המפות לא ענה. נסו שוב בעוד רגע.<br><button class="showmore" onclick="load()">נסו שוב</button>'); return; }
  const seen=new Set();
  all = data.elements.map(el=>{
    const lat=el.lat??el.center?.lat, lon=el.lon??el.center?.lon; if (lat==null) return null;
    const t=el.tags||{}; const name=t['name:he']||t.name||t['name:en']; if (!name) return null;
    if (t.shop || NOT_DOJO.includes(t.amenity)) return null;
    const k=name.trim().toLowerCase()+'|'+lat.toFixed(3)+lon.toFixed(3); if (seen.has(k)) return null; seen.add(k);
    const addr=[[t['addr:street'],t['addr:housenumber']].filter(Boolean).join(' '), t['addr:city']].filter(Boolean).join(', ');
    return {id:el.type+el.id, name, lat, lon, t, arts:classify(t), kids:isKids(t), phone:firstPhone(t), addr,
      hours:hoursText(t.opening_hours), web:t.website||t['contact:website']||t['contact:facebook']||'', city:t['addr:city']||'', dist:hav(center.lat,center.lon,lat,lon)};
  }).filter(Boolean).filter(p=>p.dist<=radiusKm+0.05).sort((a,b)=>a.dist-b.dist);
  render();
  fillAddresses(seq);
}

function visibleBase(){ return all.filter(p => showKids || !p.kids); }
function render(){
  buildFilters();
  const base = visibleBase().filter(p => art==='all' || p.arts.includes(art));
  const list = onlyPhone ? base.filter(p=>p.phone) : base;
  const hidden = base.length - list.length;
  if (!all.length){ status('לא נמצאו מכונים ממופים ברדיוס '+radiusKm+' ק״מ.<br>נסו רדיוס גדול יותר.'); return; }
  let h = `<div class="summary"><b>${list.length}</b> מכונים${onlyPhone?' עם טלפון':''} · ${esc(center.label||'')} · מהקרוב לרחוק</div>`;
  if (!list.length) h += `<div class="empty" style="padding:20px">לאף מכון כאן אין טלפון רשום במפה.</div>`;
  h += list.map(card).join('');
  if (onlyPhone && hidden) h += `<button class="showmore" id="showAll">הצג עוד ${hidden} בלי טלפון (עם חיפוש טלפון בגוגל)</button>`;
  h += `<div class="note">המידע מ־OpenStreetMap. זמני ההגעה משוערים לפי מרחק; Waze ייתן זמן מדויק.</div>`;
  $('main').innerHTML = h;
  const sa=$('showAll'); if (sa) sa.onclick=()=>{ onlyPhone=false; save(); render(); };
}
function card(p){
  const g = 'https://www.google.com/search?q='+encodeURIComponent(p.name+' '+(p.city||center.label||'')+' טלפון');
  return `<div class="card">
    <div class="top"><div class="name">${esc(p.name)}<div class="arts">${p.arts.map(a=>ARTNAME[a]).join(' · ')}${p.kids?' · חוג ילדים':''}</div></div>
      <div class="dist">${fmtKm(p.dist)}<small>${travel(p.dist)}</small></div></div>
    <div class="line">${I.pin}<div class="v ${p.addr?'':'none'}" data-addr="${p.id}">${p.addr?esc(p.addr):'מאתר כתובת…'}</div></div>
    ${p.hours?`<div class="line">${I.clock}<div class="v">${esc(p.hours)}</div></div>`:''}
    ${p.web?`<div class="line">${I.web}<div class="v"><a href="${esc(/^https?:/i.test(p.web)?p.web:'https://'+p.web)}" target="_blank" rel="noopener">${esc(p.web.replace(/^https?:\/\/(www\.)?/,'').replace(/\/$/,''))}</a></div></div>`:''}
    <div class="acts">
      ${p.phone?`<a class="act call" href="${telHref(p.phone)}">${I.phone}${esc(p.phone)}</a>
        <a class="act" href="https://wa.me/${esc(waNum(p.phone))}" target="_blank" rel="noopener" aria-label="וואטסאפ">${I.chat}</a>`
       :`<a class="act find" href="${g}" target="_blank" rel="noopener">${I.search}מצא טלפון בגוגל</a>`}
      <a class="act" href="https://waze.com/ul?ll=${p.lat},${p.lon}&navigate=yes" target="_blank" rel="noopener" aria-label="ניווט ב־Waze">${I.car}</a>
    </div>
  </div>`;
}

/* missing addresses: look them up one per second (the free service's rule), nearest first */
async function fillAddresses(seq){
  for (const p of all.filter(x=>!x.addr).slice(0,25)){
    if (seq!==loadSeq) return;
    try{
      const r=await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=18&accept-language=he&lat=${p.lat}&lon=${p.lon}`);
      const a=(await r.json()).address||{};
      p.city = p.city || a.city||a.town||a.village||'';
      p.addr=[[a.road,a.house_number].filter(Boolean).join(' '), p.city].filter(Boolean).join(', ') || 'כתובת לא ידועה';
      const el=document.querySelector(`[data-addr="${p.id}"]`); if (el){ el.textContent=p.addr; el.classList.remove('none'); }
    }catch(e){}
    await new Promise(r=>setTimeout(r,1100));
  }
}

/* ---------- choose the location ---------- */
async function setCenter(lat, lon, label){
  center={lat,lon,label};
  load();
  try{
    const r=await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=14&accept-language=he&lat=${lat}&lon=${lon}`);
    const js=await r.json(); const a=js.address||{};
    cc=(a.country_code||'').toLowerCase()||null;
    if (label==='סביבי'){ center.label=a.suburb||a.neighbourhood||a.city||a.town||a.village||label; const s=document.querySelector('.summary'); if (s) render(); }
  }catch(e){}
}
$('meBtn').onclick=()=>{
  if (!navigator.geolocation){ status('הדפדפן לא תומך באיתור מיקום. כתבו עיר.'); return; }
  status('<div class="spinner"></div>מאתר את המיקום שלך');
  navigator.geolocation.getCurrentPosition(
    p=>{ $('q').value=''; setCenter(p.coords.latitude,p.coords.longitude,'סביבי'); },
    ()=>status('לא קיבלתי מיקום. אשרו הרשאת מיקום לאתר, או כתבו עיר.'),
    {enableHighAccuracy:true,timeout:12000});
};
let sTimer=null;
$('q').addEventListener('input',e=>{
  clearTimeout(sTimer); const v=e.target.value.trim();
  if (v.length<2){ $('sugg').style.display='none'; return; }
  sTimer=setTimeout(async()=>{
    try{
      const r=await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=5&accept-language=he&q='+encodeURIComponent(v));
      const js=await r.json(); const box=$('sugg'); box.innerHTML='';
      if (!js.length){ box.style.display='none'; return; }
      js.forEach(x=>{ const d=document.createElement('div'); d.textContent=x.display_name;
        d.onclick=()=>{ box.style.display='none'; const s=x.display_name.split(',')[0]; $('q').value=s; $('q').blur(); setCenter(+x.lat,+x.lon,s); };
        box.appendChild(d); });
      box.style.display='block';
    }catch(e){}
  },450);
});
$('q').addEventListener('keydown',e=>{ if (e.key==='Enter'){ const f=$('sugg').firstChild; if (f) f.click(); }});
document.addEventListener('click',e=>{ if (!e.target.closest('.field')) $('sugg').style.display='none'; });
</script>
</body>
