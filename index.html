<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#fbf8ef">
<title>dojomaps</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="dojomaps">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&family=Secular+One&display=swap" rel="stylesheet">
<style>
/* Layout: light header with search + art filters; main area switches between a location map (draggable glove) and Google results; action bar at the bottom. */
:root{
  --bg:#f1f5e6;        /* light leaf wash behind the maps */
  --panel:#fbf8ef;     /* warm paper */
  --panel2:#ffffff;
  --line:#dfe5cc;
  --green:#4e7d1e;     /* continents, deepened for white text */
  --green-hi:#8fb23f;  /* continents, as in the logo */
  --green-soft:#e7f0d3;
  --gold:#d9b46a;
  --text:#0b2140;      /* glove navy */
  --muted:#5d6d86;
  --font-body:Rubik, "Segoe UI", Arial, sans-serif;
  --font-display:"Secular One", Rubik, "Segoe UI", Arial, sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--panel);color:var(--text);font-family:var(--font-body);overflow:hidden}
button,input{font-family:inherit;color:inherit}
svg.i{width:20px;height:20px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#app{display:flex;flex-direction:column;height:100dvh}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}

/* header */
header{position:relative;z-index:1200;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top));background:var(--panel);border-bottom:2px solid var(--green-hi);touch-action:pan-x pan-y}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.brand img{height:50px;width:auto}
.brandTxt{flex:1;min-width:0}
.word{text-align:right;font-family:var(--font-display);font-size:26px;line-height:1;direction:ltr;letter-spacing:.3px}
.word .a{color:var(--text)} .word .b{color:var(--green)}
.tag{font-size:12px;color:var(--muted);margin-top:3px}
.install{display:inline-flex;align-items:center;gap:6px;background:var(--green-soft);border:1px solid var(--green-hi);color:var(--green);border-radius:999px;padding:6px 11px;font-size:13px;font-weight:700;cursor:pointer}
.install[hidden]{display:none}
.install svg{width:16px;height:16px}
.row{display:flex;gap:8px;align-items:center}
.search{flex:1;position:relative;min-width:0}
.search svg{position:absolute;right:11px;top:50%;transform:translateY(-50%);color:var(--muted);width:18px;height:18px}
.search input{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:11px 38px 11px 12px;font-size:15px;outline:none}
.search input::placeholder{color:var(--muted)}
.search input:focus{border-color:var(--green)}
.btn{display:inline-flex;align-items:center;gap:6px;border-radius:12px;padding:10px 12px;font-size:14px;cursor:pointer;white-space:nowrap;border:1px solid var(--line);background:var(--panel2)}
.btn.green{background:var(--green);border-color:var(--green);color:#fff;font-weight:700}
.sugg{position:absolute;top:100%;right:0;left:0;background:var(--panel2);border:1px solid var(--line);border-radius:12px;margin-top:4px;overflow:hidden;display:none;box-shadow:0 10px 30px #0b214022}
.sugg div{padding:10px 12px;font-size:14px;border-bottom:1px solid var(--line);cursor:pointer}
.sugg div:hover{background:var(--green-soft)}
.sugg div:last-child{border:none}
.radius{margin-top:10px;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.radius input{flex:1;accent-color:var(--green)}
.radius b{min-width:58px;text-align:center;color:var(--green);font-weight:700;font-variant-numeric:tabular-nums}
.chips{display:flex;gap:6px;overflow-x:auto;margin-top:10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips.sub{margin-top:6px}
.chips.sub:empty{display:none}
.chip{flex:0 0 auto;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel2);font-size:13px;color:var(--muted);cursor:pointer}
.chip.on{background:var(--green);color:#fff;border-color:var(--green);font-weight:700}
.chips.sub .chip{font-size:12px;padding:5px 10px}
.chips.sub .chip.on{background:var(--green-soft);border-color:var(--green-hi);color:var(--green)}

/* main */
main{flex:1;position:relative;background:var(--bg);isolation:isolate}
#pick,#res{position:absolute;inset:0}
main[data-view="pick"] #res,main[data-view="res"] #pick{visibility:hidden}
#pick .leaflet-tile-pane{filter:saturate(.8) sepia(.06)}
.leaflet-container{font-family:var(--font-body);background:var(--bg)}
.leaflet-control-attribution{background:#fbf8efcc !important}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center}
.empty img{height:120px}
.empty h2{font-family:var(--font-display);font-weight:400;font-size:21px;margin:0;color:var(--green)}
.empty p{margin:0;font-size:14px;line-height:1.6;max-width:32ch;color:var(--muted)}

.seg{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:1100;display:flex;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:3px;box-shadow:0 4px 14px #0b21401f}
.seg button{border:0;background:transparent;padding:7px 14px;border-radius:999px;font-size:13px;color:var(--muted);cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.seg button svg{width:16px;height:16px}
.seg button.on{background:var(--green);color:#fff;font-weight:700}
.hint{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);z-index:1100;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:13px;color:var(--text);white-space:nowrap;box-shadow:0 4px 14px #0b21401f;pointer-events:none}
.cta{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);z-index:1100;display:inline-flex;align-items:center;gap:8px;background:var(--green);color:#fff;border:0;border-radius:999px;padding:12px 20px;font-size:15px;font-weight:700;cursor:pointer;box-shadow:0 6px 18px #4e7d1e55;white-space:nowrap}
.cta[hidden],.hint[hidden]{display:none}

/* the draggable glove */
.glove{position:relative;width:36px;height:62px;cursor:grab;transition:transform .15s}
.glove img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 4px 4px #0b214055);pointer-events:none}
.glove::after{content:"";position:absolute;bottom:-4px;left:50%;width:22px;height:7px;margin-left:-11px;border-radius:50%;background:#0b214040;z-index:-1}
.leaflet-dragging .glove,.glove.lift{transform:translateY(-10px) scale(1.12);cursor:grabbing}
@media (prefers-reduced-motion:reduce){.glove{transition:none}}

.toast{position:absolute;top:56px;left:50%;transform:translateX(-50%);z-index:1150;background:var(--text);color:#fff;padding:8px 14px;border-radius:999px;font-size:13px;display:none;max-width:calc(100% - 32px);text-align:center}

/* footer */
footer{background:var(--panel);border-top:2px solid var(--green-hi);padding:10px 14px;padding-bottom:calc(10px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:10px;touch-action:pan-x pan-y}
footer[hidden]{display:none}
.q{flex:1;min-width:0;font-size:12px;color:var(--muted);line-height:1.4}
.q b{display:block;color:var(--text);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.q span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
footer a{display:inline-flex;align-items:center;gap:8px;background:var(--green);color:#fff;text-decoration:none;font-weight:700;font-size:14px;padding:11px 14px;border-radius:12px;white-space:nowrap}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">
      <img data-logo alt="dojomaps">
      <div class="brandTxt">
        <div class="word"><span class="a">dojo</span><span class="b">maps</span></div>
        <div class="tag">כל מכוני אמנויות הלחימה סביבך</div>
      </div>
      <button class="install" id="installBtn" hidden><svg class="i" viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>התקנה</button>
    </div>
    <div class="row">
      <div class="search">
        <svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" placeholder="חיפוש עיר או כתובת" autocomplete="off" aria-label="חיפוש עיר או כתובת">
        <div class="sugg" id="sugg"></div>
      </div>
      <button class="btn green" id="meBtn"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2.5"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>המיקום שלי</button>
    </div>
    <div class="radius">
      <label for="rad">רדיוס</label>
      <input type="range" id="rad" min="1" max="30" step="1" value="5">
      <b id="radVal">5 ק״מ</b>
    </div>
    <div class="chips" id="arts"></div>
    <div class="chips sub" id="styles"></div>
  </header>

  <main id="main" data-view="pick">
    <div id="pick"></div>
    <div id="res">
      <div class="empty" id="resEmpty">
        <img data-logo alt="">
        <h2>עוד לא נבחר מיקום</h2>
        <p>גררו את הכפפה במפת המיקום, חפשו עיר או לחצו "המיקום שלי".</p>
      </div>
    </div>
    <div class="seg" role="tablist">
      <button id="segPick" class="on" role="tab"><svg class="i" viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>מיקום</button>
      <button id="segRes" role="tab"><svg class="i" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>תוצאות</button>
    </div>
    <div class="hint" id="hint">גררו את הכפפה למקום שבו תרצו לחפש</div>
    <button class="cta" id="cta" hidden><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>הצג מכונים כאן</button>
    <div class="toast" id="toast"></div>
  </main>

  <footer id="bar" hidden>
    <div class="q"><b id="qTitle"></b><span id="qSub"></span></div>
    <a id="openG" target="_blank" rel="noopener"><svg class="i" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>גוגל מפס</a>
  </footer>
</div>

if (isIOS && !standalone) $('installBtn').hidden = false;
$('installBtn').onclick = async () => {
  if (deferredPrompt){ deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt = null; $('installBtn').hidden = true; return; }
  if (isIOS) toast('בספארי: כפתור השיתוף ואז "הוספה למסך הבית"', 6000);
};

/* ---------- arts: Hebrew label, English query, local-language queries by country code ---------- */
const ARTS = [
  {id:'all',     he:'כל אמנויות הלחימה', en:'martial arts', local:{il:'אמנויות לחימה',jp:'武道 道場',kr:'무술 도장',cn:'武术',tw:'武術',hk:'武術',th:'ศิลปะการต่อสู้',ru:'единоборства',ua:'єдиноборства',de:'Kampfsport',at:'Kampfsport',ch:'Kampfsport',fr:'arts martiaux',be:'arts martiaux',es:'artes marciales',mx:'artes marciales',ar:'artes marciales',it:'arti marziali',pt:'artes marciais',br:'artes marciais',nl:'vechtsport',pl:'sztuki walki',gr:'πολεμικές τέχνες',tr:'dövüş sanatları',cz:'bojová umění',ro:'arte marțiale',hu:'harcművészet'}},
  {id:'karate',  he:'קראטה',   en:'karate dojo',   local:{il:'קראטה',jp:'空手 道場',kr:'가라테',cn:'空手道',tw:'空手道',ru:'карате',ua:'карате',gr:'καράτε',th:'คาราเต้'},
     styles:[['shotokan','שוטוקאן','shotokan karate'],['kyokushin','קיוקושין','kyokushin karate'],['goju','גוג׳ו ריו','goju ryu karate'],['wado','וואדו ריו','wado ryu karate'],['shito','שיטו ריו','shito ryu karate']]},
  {id:'judo',    he:'ג׳ודו',    en:'judo club',     local:{il:'ג׳ודו',jp:'柔道',kr:'유도',cn:'柔道',ru:'дзюдо',ua:'дзюдо',gr:'τζούντο'}},
  {id:'bjj',     he:'ג׳יו ג׳יטסו', en:'brazilian jiu jitsu', local:{il:'ג׳יו ג׳יטסו',jp:'柔術',ru:'джиу-джитсу',br:'jiu-jitsu',pt:'jiu-jitsu'}},
  {id:'krav',    he:'קרב מגע',  en:'krav maga',     local:{il:'קרב מגע'}},
  {id:'tkd',     he:'טאקוונדו', en:'taekwondo',     local:{il:'טאקוונדו',kr:'태권도',jp:'テコンドー',ru:'тхэквондо'}},
  {id:'boxing',  he:'אגרוף',    en:'boxing gym',    local:{il:'אגרוף',jp:'ボクシングジム',th:'มวยสากล',ru:'бокс',es:'boxeo',mx:'boxeo',fr:'boxe',it:'pugilato'}},
  {id:'muay',    he:'מואי תאי וקיקבוקס', en:'muay thai kickboxing', local:{il:'מואי תאי',th:'มวยไทย',jp:'ムエタイ',nl:'kickboksen'}},
  {id:'mma',     he:'MMA',      en:'MMA gym',       local:{}},
  {id:'aikido',  he:'אייקידו',  en:'aikido dojo',   local:{il:'אייקידו',jp:'合気道',ru:'айкидо'}},
  {id:'kungfu',  he:'קונג פו',  en:'kung fu',       local:{il:'קונג פו',cn:'功夫 武馆',tw:'功夫',hk:'功夫',jp:'カンフー'},
     styles:[['wingchun','וינג צ׳ון','wing chun'],['taichi','טאי צ׳י','tai chi'],['wushu','וושו','wushu'],['sanda','סנדה','sanda']]},
  {id:'capoeira',he:'קפוארה',   en:'capoeira',      local:{il:'קפוארה'}},
  {id:'kendo',   he:'קנדו ואיאידו', en:'kendo iaido', local:{il:'קנדו',jp:'剣道'}},
  {id:'wrestle', he:'היאבקות וסמבו', en:'wrestling sambo', local:{il:'היאבקות',ru:'самбо борьба',jp:'レスリング',tr:'güreş'}},
  {id:'fma',     he:'קאלי וסילאט', en:'kali eskrima silat', local:{}},
  {id:'ninj',    he:'נינג׳וטסו', en:'ninjutsu bujinkan', local:{jp:'忍術'}},
  {id:'hapkido', he:'הפקידו',   en:'hapkido',       local:{kr:'합기도'}},
  {id:'systema', he:'סיסטמה',   en:'systema',       local:{ru:'система рукопашный бой'}}
];
const BY = Object.fromEntries(ARTS.map(a=>[a.id,a]));

/* ---------- state ---------- */
let center = null, radiusKm = 5, art = 'all', style = null, cc = null;
try { const s = JSON.parse(localStorage.getItem('dojomaps') || '{}'); if (s.art && BY[s.art]) art = s.art; if (s.r) radiusKm = s.r; } catch(e){}
function save(){ try{ localStorage.setItem('dojomaps', JSON.stringify({art, r:radiusKm})); }catch(e){} }
$('rad').value = radiusKm; $('radVal').textContent = radiusKm+' ק״מ';

/* ---------- location map with the draggable glove ---------- */
const DEFAULT = [32.0853, 34.7818];
const map = L.map('pick',{zoomControl:false}).setView(DEFAULT, 12);
map.attributionControl.setPrefix(false);
const tiles = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19, attribution:'© OpenStreetMap'}).addTo(map);
let tileErrors = 0, switched = false;
tiles.on('tileerror', ()=>{
  if (switched || ++tileErrors < 4) return;
  switched = true;
  tiles.setUrl('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}');
  map.attributionControl.addAttribution('Tiles © Esri');
});
const glove = L.marker(DEFAULT, {
  draggable:true, autoPan:true,
  icon:L.divIcon({className:'', html:`<div class="glove"><img src="${LOGO}" alt=""></div>`, iconSize:[36,62], iconAnchor:[18,60]})
}).addTo(map);
const circle = L.circle(DEFAULT, {radius:radiusKm*1000, color:'#4e7d1e', weight:2, dashArray:'6 6', fillColor:'#8fb23f', fillOpacity:.12, interactive:false}).addTo(map);
glove.on('dragstart', ()=>{ $('hint').hidden = true; glove.getElement()?.querySelector('.glove')?.classList.add('lift'); });
glove.on('drag', e => circle.setLatLng(e.target.getLatLng()));
glove.on('dragend', e => {
  glove.getElement()?.querySelector('.glove')?.classList.remove('lift');
  const p = e.target.getLatLng();
  setCenter(p.lat, p.lng, 'נקודה במפה', {stay:true});
});
map.on('click', e => setCenter(e.latlng.lat, e.latlng.lng, 'נקודה במפה', {stay:true}));

/* ---------- views ---------- */
function show(v){
  $('main').dataset.view = v;
  $('segPick').classList.toggle('on', v==='pick');
  $('segRes').classList.toggle('on', v==='res');
  $('cta').hidden = !(v==='pick' && center);
  if (v==='pick') setTimeout(()=>map.invalidateSize(), 0);
}
$('segPick').onclick = ()=>show('pick');
$('segRes').onclick = ()=>show('res');
$('cta').onclick = ()=>show('res');

/* ---------- chips ---------- */
function chip(label, on, fn){ const c=document.createElement('button'); c.className='chip'+(on?' on':''); c.textContent=label; c.onclick=fn; return c; }
function buildChips(){
  const box=$('arts'); box.innerHTML='';
  ARTS.forEach(a=>box.appendChild(chip(a.he, art===a.id, ()=>{ art=a.id; style=null; save(); buildChips(); update(); })));
  const sb=$('styles'); sb.innerHTML='';
  const st = BY[art].styles;
  if (st){
    sb.appendChild(chip('כל הסגנונות', !style, ()=>{ style=null; buildChips(); update(); }));
    st.forEach(([id,he])=>sb.appendChild(chip(he, style===id, ()=>{ style=id; buildChips(); update(); })));
  }
}
buildChips();

/* ---------- Google results ---------- */
function queryTerm(){
  const a = BY[art];
  if (style) return a.styles.find(s=>s[0]===style)[2];
  return (cc && a.local[cc]) || a.en;
}
function zoomFor(km, lat){
  const w = $('app').clientWidth || 390;
  const z = Math.log2(156543 * Math.cos(lat*Math.PI/180) * w / (2000*km));
  return Math.max(8, Math.min(17, Math.floor(z)));
}
function update(){
  if (!center) return;
  const term = queryTerm();
  const q = `${term} near ${center.lat.toFixed(5)},${center.lon.toFixed(5)}`;
  const z = zoomFor(radiusKm, center.lat);
  const src = `https://maps.google.com/maps?q=${encodeURIComponent(q)}&ll=${center.lat},${center.lon}&z=${z}&hl=he&output=embed`;
  let f = $('res').querySelector('iframe');
  if (!f){ f=document.createElement('iframe'); f.title='תוצאות בגוגל מפס'; $('resEmpty').remove(); $('res').appendChild(f); }
  if (f.src !== src) f.src = src;
  const a = BY[art];
  const styleHe = style ? a.styles.find(s=>s[0]===style)[1] : null;
  $('qTitle').textContent = (styleHe ? a.he+' · '+styleHe : a.he) + ' · ' + (center.label||'');
  $('qSub').textContent = 'מחפש "'+term+'" · רדיוס '+radiusKm+' ק״מ';
  $('openG').href = 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q);
  $('bar').hidden = false;
}

/* ---------- set the search center (from GPS, address, drag or tap) ---------- */
let geoSeq = 0;
async function setCenter(lat, lon, label, opts={}){
  center = {lat, lon, label};
  glove.setLatLng([lat,lon]); circle.setLatLng([lat,lon]);
  $('hint').hidden = true;
  if (!opts.stay){ map.fitBounds(circle.getBounds(), {padding:[30,30]}); show('res'); }
  else show('pick');
  update();
  const seq = ++geoSeq;
  try{
    const r = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=14&accept-language=he&lat=${lat}&lon=${lon}`);
    const js = await r.json();
    if (seq !== geoSeq) return;
    const prevCC = cc;
    cc = (js.address?.country_code||'').toLowerCase() || null;
    if (label==='המיקום שלי' || label==='נקודה במפה'){
      const a = js.address||{};
      const place = a.suburb||a.neighbourhood||a.city||a.town||a.village||a.state;
      if (place) center.label = place;
    }
    update();
    const local = cc && BY[art].local[cc];
    if (cc !== prevCC && local && cc!=='il') toast('מחפש בשפה המקומית: '+local);
  }catch(e){}
}

$('meBtn').onclick = () => {
  if (!navigator.geolocation){ toast('הדפדפן לא תומך באיתור מיקום. חפשו עיר.'); return; }
  toast('מאתר את המיקום שלך');
  navigator.geolocation.getCurrentPosition(
    p => { $('q').value=''; setCenter(p.coords.latitude, p.coords.longitude, 'המיקום שלי'); },
    () => toast('לא קיבלתי מיקום. אשרו הרשאת מיקום, או גררו את הכפפה.'),
    {enableHighAccuracy:true, timeout:12000}
  );
};
let tTimer=null;
function toast(msg, ms=3200){ const t=$('toast'); t.textContent=msg; t.style.display='block'; clearTimeout(tTimer); tTimer=setTimeout(()=>t.style.display='none', ms); }

/* ---------- address search ---------- */
let sTimer=null;
$('q').addEventListener('input', e => {
  clearTimeout(sTimer);
  const v = e.target.value.trim();
  if (v.length < 2){ $('sugg').style.display='none'; return; }
  sTimer = setTimeout(()=>geocode(v), 450);
});
$('q').addEventListener('keydown', e => { if (e.key==='Enter'){ const f=$('sugg').firstChild; if (f) f.click(); }});
async function geocode(v){
  try{
    const r = await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=5&accept-language=he&q='+encodeURIComponent(v));
    const js = await r.json();
    const box = $('sugg'); box.innerHTML='';
    if (!js.length){ box.style.display='none'; return; }
    js.forEach(x=>{
      const d=document.createElement('div');
      d.textContent = x.display_name;
      d.onclick = ()=>{ box.style.display='none'; const short=x.display_name.split(',')[0]; $('q').value=short; $('q').blur(); setCenter(+x.lat, +x.lon, short); };
      box.appendChild(d);
    });
    box.style.display='block';
  }catch(e){}
}
document.addEventListener('click', e => { if (!e.target.closest('.search')) $('sugg').style.display='none'; });

/* ---------- radius ---------- */
let rTimer=null;
$('rad').addEventListener('input', e => {
  radiusKm = +e.target.value;
  $('radVal').textContent = radiusKm+' ק״מ';
  circle.setRadius(radiusKm*1000);
  clearTimeout(rTimer);
  rTimer = setTimeout(()=>{ save(); if ($('main').dataset.view==='pick') map.fitBounds(circle.getBounds(),{padding:[30,30]}); update(); }, 350);
});
</script>
