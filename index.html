<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#fbf8ef">
<title>dojomaps</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="dojomaps">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&family=Secular+One&display=swap" rel="stylesheet">
<style>
/* Layout: logo on top, the chosen art, a searchable list of 230 martial arts, optional "where" field, one big button that opens Google Maps. */
:root{
  --bg:#fbf8ef;
  --panel:#ffffff;
  --line:#dfe5cc;
  --green:#4e7d1e;
  --green-hi:#8fb23f;
  --green-soft:#e7f0d3;
  --text:#0b2140;
  --muted:#5d6d86;
  --font-body:Rubik, "Segoe UI", Arial, sans-serif;
  --font-display:"Secular One", Rubik, "Segoe UI", Arial, sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--font-body)}
button,input{font-family:inherit;color:inherit}
svg.i{width:20px;height:20px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}
#app{display:flex;flex-direction:column;height:100dvh}

header{display:flex;align-items:center;gap:12px;padding:14px 16px 12px;padding-top:calc(14px + env(safe-area-inset-top))}
header img{height:58px;width:auto}
.brandTxt{flex:1;min-width:0}
.word{font-family:var(--font-display);font-size:30px;line-height:1;direction:ltr;text-align:right}
.word .a{color:var(--text)} .word .b{color:var(--green)}
.tag{font-size:13px;color:var(--muted);margin-top:4px}
.install{display:inline-flex;align-items:center;gap:6px;background:var(--green-soft);border:1px solid var(--green-hi);color:var(--green);border-radius:999px;padding:6px 11px;font-size:13px;font-weight:700;cursor:pointer}
.install[hidden]{display:none}
.install svg{width:16px;height:16px}

main{flex:1;overflow-y:auto;padding:4px 16px 16px}
h2{font-size:14px;font-weight:500;color:var(--muted);margin:6px 2px 10px}
.picked{display:flex;align-items:center;gap:10px;background:var(--green);color:#fff;border-radius:14px;padding:12px 14px;margin-bottom:10px}
.picked .t{flex:1;min-width:0}
.picked b{display:block;font-size:16px}
.picked small{font-size:12px;opacity:.85}
.picked button{border:0;background:#ffffff26;color:#fff;border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer}
.picked button[hidden]{display:none}
.list{margin-top:8px;background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.opt{display:flex;align-items:center;gap:10px;width:100%;text-align:right;border:0;border-bottom:1px solid var(--line);background:transparent;padding:11px 14px;cursor:pointer;font-size:15px}
.opt:last-child{border-bottom:0}
.opt:hover,.opt:focus-visible{background:var(--green-soft)}
.opt .n{flex:1;min-width:0}
.opt .o{font-size:12px;color:var(--muted);white-space:nowrap}
.opt mark{background:none;color:var(--green);font-weight:700}
.more{font-size:12px;color:var(--muted);text-align:center;padding:8px}
.count{font-size:12px;color:var(--muted);margin:6px 2px 0}

.where{margin-top:18px}
.field{position:relative}
.field svg{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--muted);width:18px;height:18px}
.field input{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:13px 40px 13px 14px;font-size:15px;outline:none}
.field input:focus{border-color:var(--green)}
.field input::placeholder{color:var(--muted)}

footer{padding:12px 16px;padding-bottom:calc(14px + env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid var(--line)}
.go{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;background:var(--green);color:#fff;text-decoration:none;font-weight:700;font-size:17px;padding:16px;border-radius:16px;box-shadow:0 6px 18px #4e7d1e44}
.go svg{width:22px;height:22px}
.what{font-size:12px;color:var(--muted);text-align:center;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.what b{color:var(--text);font-weight:500}
</style>
</head>
<body>
<div id="app">
  <header>
    <img data-logo alt="dojomaps">
    <div class="brandTxt">
      <div class="word"><span class="a">dojo</span><span class="b">maps</span></div>
      <div class="tag">מוצאים דוג׳ו בכל מקום בעולם</div>
    </div>
    <button class="install" id="installBtn" hidden><svg class="i" viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>התקנה</button>
  </header>

  <main>
    <div class="picked"><div class="t"><b id="pickName"></b><small id="pickSub"></small></div><button id="clearBtn" hidden>ביטול</button></div>
    <div class="where" style="margin:0 0 14px">
      <h2>איפה?</h2>
      <div class="field">
        <svg class="i" viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>
        <input id="where" placeholder="סביבי (או כתבו עיר)" autocomplete="off" aria-label="איפה לחפש">
      </div>
    </div>
    <h2>איזו אמנות לחימה?</h2>
    <div class="field">
      <svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="artQ" placeholder="חפשו: קיוקושין, סילאט, סמבו, wing chun…" autocomplete="off" aria-label="חיפוש אמנות לחימה">
    </div>
    <div class="count" id="count"></div>
    <div class="list" id="list"></div>

  </main>

  <footer>
    <a class="go" id="go" target="_blank" rel="noopener"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>חפש בגוגל מפס</a>
    <div class="what" id="what"></div>
  </footer>
</div>

/* ---------- install as app ---------- */
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
let deferredPrompt = null;
addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredPrompt = e; $('installBtn').hidden = false; });
addEventListener('appinstalled', () => { $('installBtn').hidden = true; });
if (isIOS && !standalone) $('installBtn').hidden = false;
$('installBtn').onclick = async () => {
  if (deferredPrompt){ deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt = null; $('installBtn').hidden = true; return; }
  if (isIOS) alert('בספארי: כפתור השיתוף ואז "הוספה למסך הבית"');
};

  'judo club':{il:'ג׳ודו',jp:'柔道',kr:'유도',cn:'柔道',ru:'дзюдо',ua:'дзюдо',gr:'τζούντο'},
  'brazilian jiu jitsu':{il:'ג׳יו ג׳יטסו',jp:'柔術',ru:'джиу-джитсу',br:'jiu-jitsu',pt:'jiu-jitsu'},
  'krav maga':{il:'קרב מגע'},
  'taekwondo':{il:'טאקוונדו',kr:'태권도',jp:'テコンドー',ru:'тхэквондо'},
  'boxing gym':{il:'אגרוף',jp:'ボクシングジム',th:'มวยสากล',ru:'бокс',es:'boxeo',mx:'boxeo',fr:'boxe',it:'pugilato'},
  'muay thai':{il:'מואי תאי',th:'มวยไทย',jp:'ムエタイ'},
  'aikido dojo':{il:'אייקידו',jp:'合気道',ru:'айкидо'},
  'kung fu':{il:'קונג פו',cn:'功夫 武馆',tw:'功夫',hk:'功夫',jp:'カンフー'},
  'kendo':{il:'קנדו',jp:'剣道',kr:'검도'},
  'wrestling club':{il:'היאבקות',ru:'борьба',jp:'レスリング',tr:'güreş'},
  'sambo':{ru:'самбо'},
  'kickboxing':{il:'קיקבוקס',nl:'kickboksen',de:'Kickboxen',ru:'кикбоксинг'},
  'capoeira':{il:'קפוארה'},
  'hapkido':{kr:'합기도'},
  'kyudo':{jp:'弓道'},
  'iaido':{jp:'居合道'},
  'sumo':{jp:'相撲'},
  'wing chun':{hk:'詠春',cn:'咏春'},
  'tai chi':{cn:'太极拳',tw:'太極拳',hk:'太極拳'},
  'mma gym':{il:'MMA'}
};

/* the phone's time zone follows the traveller, so it tells the country without asking for location */
const TZ = {'Asia/Jerusalem':'il','Asia/Tel_Aviv':'il','Asia/Tokyo':'jp','Asia/Seoul':'kr','Asia/Shanghai':'cn','Asia/Taipei':'tw','Asia/Hong_Kong':'hk','Asia/Bangkok':'th',
  'Europe/Moscow':'ru','Europe/Kiev':'ua','Europe/Kyiv':'ua','Europe/Berlin':'de','Europe/Vienna':'at','Europe/Zurich':'ch','Europe/Paris':'fr','Europe/Brussels':'be',
  'Europe/Madrid':'es','Europe/Rome':'it','Europe/Lisbon':'pt','Europe/Amsterdam':'nl','Europe/Warsaw':'pl','Europe/Athens':'gr','Europe/Istanbul':'tr',
  'Europe/Prague':'cz','Europe/Bucharest':'ro','Europe/Budapest':'hu','America/Sao_Paulo':'br','America/Mexico_City':'mx','America/Argentina/Buenos_Aires':'ar'};
let tz = ''; try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || ''; } catch(e){}
const hereCC = TZ[tz] || null;

/* ---------- state ---------- */
let pick = ALL, whereCC = null;
try { const s = JSON.parse(localStorage.getItem('dojomaps') || '{}'); const f = ARTS.find(a=>a.q===s.q); if (f) pick = f; } catch(e){}
function save(){ try{ localStorage.setItem('dojomaps', JSON.stringify({q: pick.q})); }catch(e){} }

/* ---------- search the database ---------- */
const POPULAR = ['karate dojo','judo club','brazilian jiu jitsu','krav maga','muay thai','boxing gym','mma gym','taekwondo','aikido dojo','kung fu','kickboxing','capoeira'];
function score(a, nq){
  if (!nq) return 0;
  let best = -1;
  for (const w of a.words){ const nw = norm(w); if (!nw) continue;
    if (nw === nq) return 100;
    if (nw.startsWith(nq)) best = Math.max(best, 80 - nw.length/10);
    else if (nw.includes(nq)) best = Math.max(best, 50 - nw.length/10);
  }
  return best;
}
function hl(text, q){
  const el = document.createElement('span');
  const i = q ? text.toLowerCase().indexOf(q.toLowerCase()) : -1;
  if (i < 0){ el.textContent = text; return el; }
  el.append(text.slice(0,i)); const m=document.createElement('mark'); m.textContent=text.slice(i,i+q.length); el.append(m, text.slice(i+q.length));
  return el;
}
function renderList(){
  const raw = $('artQ').value.trim(), nq = norm(raw);
  let items;
  if (!nq){ items = POPULAR.map(q=>ARTS.find(a=>a.q===q)).filter(Boolean); $('count').textContent = 'הנפוצות · '+ARTS.length+' אמנויות לחימה במאגר'; }
  else {
    items = ARTS.map(a=>[a,score(a,nq)]).filter(x=>x[1]>=0).sort((x,y)=>y[1]-x[1]).map(x=>x[0]);
    $('count').textContent = items.length ? items.length+' תוצאות' : 'לא נמצא במאגר. אפשר לחפש את המילה הזאת ישירות בגוגל מפס:';
  }
  const box = $('list'); box.innerHTML = '';
  if (nq && !items.length){
    const free = {he:raw, q:raw, o:''};
    box.appendChild(optEl(free, raw, 'חיפוש חופשי'));
  }
  items.slice(0,40).forEach(a => box.appendChild(optEl(a, raw)));
  if (items.length > 40){ const m=document.createElement('div'); m.className='more'; m.textContent='ועוד '+(items.length-40)+'. כתבו עוד כדי לצמצם.'; box.appendChild(m); }
  box.hidden = !box.children.length;
}
function optEl(a, raw, sub){
  const b = document.createElement('button'); b.className='opt';
  const n = document.createElement('span'); n.className='n'; n.appendChild(hl(a.he, raw));
  const o = document.createElement('span'); o.className='o'; o.textContent = sub || ORIGIN[a.o] || '';
  b.append(n, o);
  b.onclick = () => { pick = a; save(); $('artQ').value=''; renderList(); refresh(); scrollTo({top:0,behavior:'smooth'}); document.querySelector('main').scrollTo({top:0,behavior:'smooth'}); };
  return b;
}
$('artQ').addEventListener('input', renderList);
$('clearBtn').onclick = () => { pick = ALL; save(); refresh(); };

/* ---------- the Google Maps link ---------- */
function refresh(){
  const place = $('where').value.trim();
  const cc = place ? whereCC : hereCC;
  const term = (cc && LOCAL[pick.q] && LOCAL[pick.q][cc]) || pick.q;
  $('pickName').textContent = pick.he;
  $('pickSub').textContent = pick === ALL ? 'בחרו מהרשימה כדי לצמצם' : (ORIGIN[pick.o] ? 'מקור: '+ORIGIN[pick.o] : 'חיפוש חופשי');
  $('clearBtn').hidden = pick === ALL;
  const q = place ? `${term} ${place}` : term;          /* no place: Google Maps searches around where you are */
  $('go').href = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(q);
  $('what').innerHTML = 'יחפש <b></b> ' + (place ? 'ב' : 'סביבך');
  $('what').querySelector('b').textContent = '"' + term + '"';
  if (place) $('what').append(place);
}

/* a typed city: find its country (to search in the local language) */
let wTimer = null, wSeq = 0;
$('where').addEventListener('input', () => {
  whereCC = null; refresh();
  clearTimeout(wTimer);
  const v = $('where').value.trim();
  if (v.length < 2) return;
  const seq = ++wSeq;
  wTimer = setTimeout(async () => {
    try {
      const r = await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&addressdetails=1&q=' + encodeURIComponent(v));
      const js = await r.json();
      if (seq !== wSeq) return;
      whereCC = (js[0]?.address?.country_code || '').toLowerCase() || null;
      refresh();
    } catch(e){}
  }, 500);
});

renderList();
refresh();
</script>
</body>
