<style>
/* Layout: sand header with search + art filters, Google Maps results fill the rest, slim action bar at the bottom. */
:root{
  --bg:#06152b;
  --panel:#f3ead3;     /* light sand, all panels */
  --panel2:#fbf6ea;
  --line:#ddcfa9;
  --gold:#d9b46a;
  --gold-hi:#94702c;
  --text:#0b2140;      /* glove navy ink */
  --muted:#5d6d86;
  --font-body:Rubik, "Segoe UI", Arial, sans-serif;
  --font-display:"Secular One", Rubik, "Segoe UI", Arial, sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--panel);color:var(--text);font-family:var(--font-body);overflow:hidden}
button,input{font-family:inherit;color:inherit}
svg.i{width:20px;height:20px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#app{display:flex;flex-direction:column;height:100dvh}

header{padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top));background:var(--panel);border-bottom:1px solid var(--gold);box-shadow:0 2px 10px #0003;z-index:10;touch-action:pan-x pan-y}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.brand img{height:50px;width:auto}
.brandTxt{flex:1;min-width:0}
.word{text-align:right;font-family:var(--font-display);font-size:26px;line-height:1;direction:ltr;letter-spacing:.3px}
.word .a{color:var(--text)} .word .b{color:var(--gold)}
.tag{font-size:12px;color:var(--muted);margin-top:3px}
.row{display:flex;gap:8px;align-items:center}
.search{flex:1;position:relative;min-width:0}
.search svg{position:absolute;right:11px;top:50%;transform:translateY(-50%);color:var(--muted);width:18px;height:18px}
.search input{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:11px 38px 11px 12px;font-size:15px;outline:none}
.search input::placeholder{color:var(--muted)}
.search input:focus{border-color:var(--gold)}
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14px;cursor:pointer;white-space:nowrap}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--text);font-weight:700}
.btn:focus-visible,.chip:focus-visible{outline:2px solid var(--gold-hi);outline-offset:2px}
.sugg{position:absolute;top:100%;right:0;left:0;background:var(--panel2);border:1px solid var(--line);border-radius:12px;margin-top:4px;overflow:hidden;display:none;z-index:20;box-shadow:0 10px 30px #0004}
.sugg div{padding:10px 12px;font-size:14px;border-bottom:1px solid var(--line);cursor:pointer}
.sugg div:last-child{border:none}
.radius{margin-top:10px;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.radius input{flex:1;accent-color:var(--gold)}
.radius b{min-width:58px;text-align:center;color:var(--gold-hi);font-weight:500;font-variant-numeric:tabular-nums}
.chips{display:flex;gap:6px;overflow-x:auto;margin-top:10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips.sub{margin-top:6px}
.chips.sub:empty{display:none}
.chip{flex:0 0 auto;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:transparent;font-size:13px;color:var(--muted);cursor:pointer}
.chip.on{background:var(--text);color:var(--panel);border-color:var(--text);font-weight:700}
.chips.sub .chip{font-size:12px;padding:5px 10px}
.chips.sub .chip.on{background:var(--gold);border-color:var(--gold);color:var(--text)}

main{flex:1;position:relative;background:var(--bg)}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.intro{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;color:#f4efe1}
.intro img{height:150px}
.intro h2{font-family:var(--font-display);font-weight:400;font-size:22px;margin:0;color:var(--gold)}
.intro p{margin:0;font-size:14px;line-height:1.6;max-width:32ch;color:#c9d3e3}

footer{background:var(--panel);border-top:1px solid var(--gold);padding:10px 14px;padding-bottom:calc(10px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:10px;touch-action:pan-x pan-y}
footer[hidden]{display:none}
.q{flex:1;min-width:0;font-size:13px;color:var(--muted);line-height:1.4}
.q b{display:block;color:var(--text);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
footer a{display:inline-flex;align-items:center;gap:8px;background:var(--text);color:var(--panel);text-decoration:none;font-weight:700;font-size:14px;padding:11px 14px;border-radius:12px;white-space:nowrap}
.toast{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:var(--panel2);color:var(--text);border:1px solid var(--line);padding:8px 14px;border-radius:999px;font-size:13px;z-index:5;display:none;white-space:nowrap}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">
      <img data-logo alt="dojomaps">

const BY = Object.fromEntries(ARTS.map(a=>[a.id,a]));

/* ---------- state ---------- */
let center = null, radiusKm = 5, art = 'all', style = null, cc = null;

/* ---------- chips ---------- */
function chip(label, on, fn){ const c=document.createElement('button'); c.className='chip'+(on?' on':''); c.textContent=label; c.onclick=fn; return c; }
function buildChips(){
  const box=$('arts'); box.innerHTML='';
  ARTS.forEach(a=>box.appendChild(chip(a.he, art===a.id, ()=>{ art=a.id; style=null; buildChips(); update(); })));
  const sb=$('styles'); sb.innerHTML='';
  const st = BY[art].styles;
  if (st){
    sb.appendChild(chip('כל הסגנונות', !style, ()=>{ style=null; buildChips(); update(); }));
    st.forEach(([id,he])=>sb.appendChild(chip(he, style===id, ()=>{ style=id; buildChips(); update(); })));
  }
}
buildChips();

/* ---------- query building ---------- */
function queryTerm(){
  const a = BY[art];
  if (style){ return a.styles.find(s=>s[0]===style)[2]; }   /* style names are searched in English worldwide */
  return (cc && a.local[cc]) || a.en;
}
function zoomFor(km, lat){
  const w = $('app').clientWidth || 390;
  const z = Math.log2(156543 * Math.cos(lat*Math.PI/180) * w / (2000*km));
  return Math.max(8, Math.min(17, Math.floor(z)));
}
function update(){
  if (!center) return;
  const term = queryTerm();
  const q = `${term} near ${center.lat.toFixed(5)},${center.lon.toFixed(5)}`;
  const z = zoomFor(radiusKm, center.lat);
  const src = `https://maps.google.com/maps?q=${encodeURIComponent(q)}&ll=${center.lat},${center.lon}&z=${z}&hl=he&output=embed`;
  let f = document.querySelector('main iframe');
  if (!f){ f=document.createElement('iframe'); f.title='תוצאות בגוגל מפס'; f.loading='eager'; f.referrerPolicy='no-referrer-when-downgrade'; $('intro').remove(); document.querySelector('main').prepend(f); }
  if (f.src !== src) f.src = src;
  const a = BY[art];
  const styleHe = style ? a.styles.find(s=>s[0]===style)[1] : null;
  $('qTitle').textContent = (styleHe ? a.he+' · '+styleHe : a.he) + ' · ' + (center.label||'');
  $('qSub').textContent = 'מחפש: "'+term+'" · רדיוס '+radiusKm+' ק״מ';
  $('openG').href = 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q);
  $('bar').hidden = false;
}

/* ---------- location ---------- */
async function setCenter(lat, lon, label){
  center = {lat, lon, label};
  cc = null;
  update();
  try{
    const r = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=10&accept-language=he&lat=${lat}&lon=${lon}`);
    const js = await r.json();
    cc = (js.address?.country_code||'').toLowerCase() || null;
    if (!label || label==='המיקום שלי'){ const a=js.address||{}; center.label = a.city||a.town||a.village||a.suburb||a.state||label; }
    update();
    const local = cc && BY[art].local[cc];
    if (local && local!==BY[art].en && cc!=='il') toast('מחפש בשפה המקומית: '+local);
  }catch(e){}
}
$('meBtn').onclick = () => {
  if (!navigator.geolocation){ toast('הדפדפן לא תומך באיתור מיקום. חפשו עיר.'); return; }
  toast('מאתר את המיקום שלך');
  navigator.geolocation.getCurrentPosition(
    p => { $('q').value=''; setCenter(p.coords.latitude, p.coords.longitude, 'המיקום שלי'); },
    () => toast('לא קיבלתי מיקום. אשרו הרשאת מיקום, או חפשו עיר.'),
    {enableHighAccuracy:true, timeout:12000}
  );
};
let tTimer=null;
function toast(msg){ const t=$('toast'); t.textContent=msg; t.style.display='block'; clearTimeout(tTimer); tTimer=setTimeout(()=>t.style.display='none',3200); }

/* ---------- address search ---------- */
let sTimer=null;
$('q').addEventListener('input', e => {
  clearTimeout(sTimer);
  const v = e.target.value.trim();
  if (v.length < 2){ $('sugg').style.display='none'; return; }
  sTimer = setTimeout(()=>geocode(v), 450);
});
$('q').addEventListener('keydown', e => { if (e.key==='Enter'){ const f=$('sugg').firstChild; if (f) f.click(); }});
async function geocode(v){
  try{
    const r = await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=5&accept-language=he&q='+encodeURIComponent(v));
    const js = await r.json();
    const box = $('sugg'); box.innerHTML='';
    if (!js.length){ box.style.display='none'; return; }
    js.forEach(x=>{
      const d=document.createElement('div');
      d.textContent = x.display_name;
      d.onclick = ()=>{ box.style.display='none'; const short=x.display_name.split(',')[0]; $('q').value=short; $('q').blur(); setCenter(+x.lat, +x.lon, short); };
      box.appendChild(d);
    });
    box.style.display='block';
  }catch(e){}
}
document.addEventListener('click', e => { if (!e.target.closest('.search')) $('sugg').style.display='none'; });

/* ---------- radius ---------- */
let rTimer=null;
$('rad').addEventListener('input', e => {
  radiusKm = +e.target.value;
  $('radVal').textContent = radiusKm+' ק״מ';
  clearTimeout(rTimer);
  rTimer = setTimeout(update, 400);
});
</script>
